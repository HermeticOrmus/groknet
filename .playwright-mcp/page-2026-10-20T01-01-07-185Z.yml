          - strong [ref=f43e64]: About
          - text: "#"
      - paragraph [ref=f43e65]: "SpaceXSI, the developer of Grok, owns trademark rights, intellectual property rights, and branding rights in “SpaceXSI” and “Grok”, combinations of those terms, and logos. These guidelines explain how you may use our marks and logos as a user (and hopefully fan) of Grok. Note: SpaceXSI is a separate company from X (formerly Twitter)."
      - heading [level=2] [ref=f43e66]:
        - link [ref=f43e67] [cursor=pointer]:
          - /url: "#content-attribution"
          - strong [ref=f43e68]: Content Attribution
          - text: "#"
      - paragraph [ref=f43e69]: "If you used Grok to generate text or images, please attribute them to SpaceXSI and Grok by displaying one of the following phrases in a legible and noticeable manner wherever the Grok-generated material is published or distributed:"
      - list [ref=f43e70]:
        - listitem [ref=f43e71]: Written with Grok
        - listitem [ref=f43e72]: Created with Grok
      - heading [level=2] [ref=f43e73]:
        - link [ref=f43e74] [cursor=pointer]:
          - /url: "#press-releases"
          - strong [ref=f43e75]: Press Releases
          - text: "#"
      - paragraph [ref=f43e76]:
        - text: Please contact us at
        - link "legal@x.ai" [ref=f43e77] [cursor=pointer]:
          - /url: mailto:legal@x.ai
        - text: before mentioning us in your press materials. We also ask that you identify SpaceXSI as a company working on building artificial intelligence to accelerate human scientific discovery, whose mission is to advance our collective understanding of the universe.
      - heading [level=2] [ref=f43e78]:
        - link [ref=f43e79] [cursor=pointer]:
          - /url: "#usage-terms"
          - strong [ref=f43e80]: Usage Terms
          - text: "#"
      - paragraph [ref=f43e81]: "“Marks” are anything that SpaceXSI uses to identify our goods or services, including our names, logos, icons, and brand design elements. If you use SpaceXSI’s Marks, you agree that SpaceXSI owns them and that any associated goodwill is ours. You may use SpaceXSI’s Marks only if you agree to the following terms:"
      - heading [level=3] [ref=f43e82]:
        - link [ref=f43e83] [cursor=pointer]:
          - /url: "#do"
          - strong [ref=f43e84]: "Do:"
          - text: "#"
      - list [ref=f43e85]:
        - listitem [ref=f43e86]: Use our Marks only to accurately refer to us or our services.
        - listitem [ref=f43e87]: Follow and observe these SpaceXSI Brand Guidelines, other guidelines we issue, and any updates.
        - listitem [ref=f43e88]: Make any changes to your use of our Marks that we may require after review.
      - heading [level=3] [ref=f43e89]:
        - link [ref=f43e90] [cursor=pointer]:
          - /url: "#dont"
          - strong [ref=f43e91]: "Don’t:"
          - text: "#"
      - list [ref=f43e92]:
        - listitem [ref=f43e93]: Use our Marks in any way that is unrelated to us or that could misrepresent your relationship with SpaceXSI, mislead, or imply our endorsement, approval, or sponsorship of you or your goods or services.
        - listitem [ref=f43e94]: Use our Marks in any app title, domain name, or the name of any product or service not made or provided by us.
        - listitem [ref=f43e95]: Add anything in close proximity to our Marks in a way that creates an impression of a new mark.
        - listitem [ref=f43e96]: Use our Marks in or as part of your marks.
      - paragraph [ref=f43e97]: We may grant others the right to use our Marks, but you are not permitted to. And we may terminate your permission to use our Marks at any time, in which case you must stop using them promptly.
